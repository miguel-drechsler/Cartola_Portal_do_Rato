{% extends "base.html" %}
{% block titulo %}Entrar — Cartola Náutico{% endblock %}
{% block conteudo %}
<section class="formulario-caixa">
  <h1>Entrar</h1>
  {% if form.errors %}<p class="aviso aviso-error">Usuário ou senha não conferem.</p>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao">Entrar</button>
  </form>
  <p class="miudo">Ainda não joga? <a href="{% url 'cadastro' %}">Criar conta</a></p>
</section>
{% endblock %}
